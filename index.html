    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 100%;
            margin: 0;
            padding: 10px;  
            background-color: #f0f0f0;      
          
        }
        h2 {
            margin-top: 0px;
            margin-bottom: 5px;
        }7
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
                                 
        }
        th, td {
            border: 1px solid #ddd;
            padding: 4px;
            text-align: left;
            font-size: 1.1em;
        }
        th {
            background-color: #f2f2f2;
        }
        input, select {
            width: 100%;
            padding: 4px;
            box-sizing: border-box;
            font-size: 1em;
        }
        button {
            margin-top: 10px;
            padding: 5px 10px;
            font-size: 1em;
        }

.copyBtn, .deleteBtn, .moveUpBtn, .moveDownBtn {
    display: inline-block;
    background-color: transparent; 
    padding: 0px 4px;
    cursor: pointer;
    font-size: 16px;
    margin: 3px 3px;
    min-width: 24px;
    height: 26px;
    line-height: 24px;
    border: 1px solid #ccc; 
    border-radius: 3px;
    box-sizing: border-box;
    vertical-align: middle;
}

.copyBtn { 
    color: #4CAF50 !important; 
    border-color: #4CAF50 !important; 
}
.deleteBtn { 
    color: #ff4d4d !important; 
    border-color: #ff4d4d !important; 
}
.moveUpBtn, .moveDownBtn { 
    color: #888 !important; 
    border-color: #ddd !important; 
}


#orderTable td:last-child {
    display: flex;
    justify-content: flex-start;
    align-items: center;
   
}

        .error {
            color: red;
            font-size: 0.8em;
        }
        #addRow {
            background-color: #7FFFD4;
            border: none;
            cursor: pointer;
        }
        #screenshotBtn, #exportExcel {
            float: left;
            margin-right: 15px;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 1em;
        }
        #screenshotBtn {
            background-color: orange;
            color: white;
        }
        #exportExcel {
            background-color: #006400;
            color: white;
        }
        .contact-info {
            float: left;
            margin-top: 10px;
            font-size: 1em;
        }
        #bidResult {
            margin-left: 10px;
        }
        .red-big-number {
            color: red;
            font-size: 1.4em;
            font-weight: bold;
        }
        .gray-number {
            color: #666;
            font-size: 1.2em;
        }

optgroup {                
    font-weight: normal;  
    color: #888;          
    background-color: #f0f0f0;
}

optgroup::after {
    content: "";
    display: block;
    height: 1px;
    background-color: #ccc;
    margin-top: 2px;
}

option {
    font-weight: normal;
    font-style: normal;
    color: #000;
    background-color: #fff;
}

@media (max-width: 600px) {
   
    #orderTable th:nth-child(5), 
    #orderTable td:nth-child(5) {
        display: none !important;
    }

   
    #orderTable th:nth-child(1) { width: 5%; }   
    #orderTable th:nth-child(2) { width: 70%; }  
    #orderTable th:nth-child(3) { width: 15%; }  
    #orderTable th:nth-child(4) { width: 10%; }  
    
   
    #orderTable th:nth-child(6),
    #orderTable td:last-child {
        width: 0.1% !important;      
        padding: 2px 0 !important;   
        margin: 0 !important;
        white-space: nowrap !important;
        display: table-cell !important; 
        font-size: 0 !important;    
        text-align: right;           
    }

 
    .copyBtn, .deleteBtn, .moveUpBtn, .moveDownBtn {
        display: inline-block !important;
        background-color: transparent !important;
        padding: 0 !important;
        margin: 0 !important;        
        min-width: 18px !important;  
        height: 24px !important;     
        font-size: 11px !important;
        border: 1px solid #ccc !important;
        border-radius: 0px !important;
        box-sizing: border-box;
        vertical-align: middle;
    }

   
    .copyBtn { color: #4CAF50 !important; border-color: #4CAF50 !important; }
    .deleteBtn { color: #ff4d4d !important; border-color: #ff4d4d !important; border-left: none !important; }
    .moveUpBtn { color: #888 !important; border-color: #ddd !important; border-left: none !important; }
    .moveDownBtn { color: #888 !important; border-color: #ddd !important; border-left: none !important; }



    .length, .quantity {
        font-size: 15px !important;  
        width: 100% !important;
        min-width: 0 !important;     
        padding: 4px 0 !important;
        text-align: center;
        box-sizing: border-box;
    }

    
    .model {
        font-size: 15px !important;
        padding: 2px 0 !important;
        width: 100% !important;
    }
}
