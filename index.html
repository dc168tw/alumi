<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>達康科技 - 鋁擠型長度試算表</title>
    <link rel="icon" type="image/x-icon" href="https://drive.google.com/thumbnail?id=1Q0nxCU5n4aFTTGWjn2cjq7jeyDPcDhEt">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 100%;
            margin: 0;
            padding: 10px;  
            background-color: #f0f0f0;   /* 淺灰色底色背景色 要白色去掉即可 需去掉註解 */    
          
        }
        h2 {
            margin-top: 0px;
            margin-bottom: 5px;
        }7
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
                                 /*  background-color: white; 添加這行確保表格保持白色背景 */  
        }
        th, td {
            border: 1px solid #ddd;
            padding: 4px;
            text-align: left;
            font-size: 1.1em;
        }
        th {
            background-color: #f2f2f2;
        }
        input, select {
            width: 100%;
            padding: 4px;
            box-sizing: border-box;
            font-size: 1em;
        }
        button {
            margin-top: 10px;
            padding: 5px 10px;
            font-size: 1em;
        }


/* 統一按鈕基礎樣式 */
.copyBtn, .deleteBtn, .moveUpBtn, .moveDownBtn {
    display: inline-block;
    background-color: transparent; /* 背景透明 */
    padding: 0px 4px;
    cursor: pointer;
    font-size: 16px;
    margin: 3px 3px;
    min-width: 24px;
    height: 26px;
    line-height: 24px;
    border: 1px solid #ccc; /* 預設邊框 */
    border-radius: 3px;
    box-sizing: border-box;
    vertical-align: middle;
}

/* 仿照手機版的顏色強化：綠加、紅減、灰移動 */
.copyBtn { 
    color: #4CAF50 !important; 
    border-color: #4CAF50 !important; 
}
.deleteBtn { 
    color: #ff4d4d !important; 
    border-color: #ff4d4d !important; 
}
.moveUpBtn, .moveDownBtn { 
    color: #888 !important; 
    border-color: #ddd !important; 
}



/* 可选：使用 flex 布局使按钮在单元格内更好地对齐 但高度不符  */
#orderTable td:last-child {
    display: flex;
    justify-content: flex-start;
    align-items: center;
   
}

        .error {
            color: red;
            font-size: 0.8em;
        }
        #addRow {
            background-color: #7FFFD4;
            border: none;
            cursor: pointer;
        }
        #screenshotBtn, #exportExcel {
            float: left;
            margin-right: 15px;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 1em;
        }
        #screenshotBtn {
            background-color: orange;
            color: white;
        }
        #exportExcel {
            background-color: #006400;
            color: white;
        }
        .contact-info {
            float: left;
            margin-top: 10px;
            font-size: 1em;
        }
        #bidResult {
            margin-left: 10px;
        }
        .red-big-number {
            color: red;
            font-size: 1.4em;
            font-weight: bold;
        }
        .gray-number {
            color: #666;
            font-size: 1.2em;
        }

optgroup {                /* 分隔(以下3段) */
    font-weight: normal;  /* 移除粗體 */
    color: #888;          /* 使用較淺的顏色 */
    background-color: #f0f0f0;
}

optgroup::after {
    content: "";
    display: block;
    height: 1px;
    background-color: #ccc;
    margin-top: 2px;
}

option {
    font-weight: normal;
    font-style: normal;
    color: #000;
    background-color: #fff;
}       


  /*  .key-instructions {
        font-size: 0.9em;
        color: #777;
        margin-top: 0px;
        margin-bottom: 5px;
        text-align: center;
        height = line-height
    } */

@media (max-width: 600px) {
    /* 1. 隱藏金額欄位 */
    #orderTable th:nth-child(5), 
    #orderTable td:nth-child(5) {
        display: none !important;
    }

    /* 2. 欄位比例極致分配：將所有空間推給「型號」 */
    #orderTable th:nth-child(1) { width: 5%; }   /* 序號 */
    #orderTable th:nth-child(2) { width: 70%; }  /* 型號 - 最大化 */
    #orderTable th:nth-child(3) { width: 15%; }  /* 長度 */
    #orderTable th:nth-child(4) { width: 10%; }  /* 數量 */
    
    /* 3. 編輯欄位：關鍵壓縮技術 */
    #orderTable th:nth-child(6),
    #orderTable td:last-child {
        width: 0.1% !important;      /* 強制壓縮到最小寬度 */
        padding: 2px 0 !important;   /* 徹底移除左右內距 */
        margin: 0 !important;
        white-space: nowrap !important;
        display: table-cell !important; /* 覆蓋掉原本的 flex 佈局 */
        font-size: 0 !important;     /* 移除 HTML 空白字元 */
        text-align: right;           /* 讓按鈕靠右對齊 */
    }



    /* 4. 精簡窄長型按鈕 (邊框樣式) */
    .copyBtn, .deleteBtn, .moveUpBtn, .moveDownBtn {
        display: inline-block !important;
        background-color: transparent !important;
        padding: 0 !important;
        margin: 0 !important;        /* 移除按鈕間距 */
        min-width: 18px !important;  /* 寬度 */
        height: 24px !important;     /* 稍微拉高，方便手指點擊 */
        font-size: 11px !important;
        border: 1px solid #ccc !important;
        border-radius: 0px !important;
        box-sizing: border-box;
        vertical-align: middle;
    }

    /* 5.邊框顏色強化：綠加、紅減、灰移動 */
    .copyBtn { color: #4CAF50 !important; border-color: #4CAF50 !important; }
    .deleteBtn { color: #ff4d4d !important; border-color: #ff4d4d !important; border-left: none !important; }
    .moveUpBtn { color: #888 !important; border-color: #ddd !important; border-left: none !important; }
    .moveDownBtn { color: #888 !important; border-color: #ddd !important; border-left: none !important; }


/* 6.針對長度與數量輸入框內的文字大小調整 */
    .length, .quantity {
        font-size: 15px !important;  /* 在這裡修改數字，例如 18px 或 1.2em */
        width: 100% !important;
        min-width: 0 !important;      /* 確保能維持縮小的寬度 */
        padding: 4px 0 !important;
        text-align: center;
        box-sizing: border-box;
    }

    /* 7. 型號下拉選單字體與寬度調整 */
    .model {
        font-size: 15px !important;
        padding: 2px 0 !important;
        width: 100% !important;
    }
}
